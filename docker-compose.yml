version: '3.8'

services:
  web:
    build: .
    ports:
      - "5051:5051"
    environment:
      - PORT=5051
      - HOST=0.0.0.0
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      # Persist historical SQLite trends archive and JSON cache files
      - trends_cache:/root/.cache/github-trending-cli
    restart: unless-stopped

volumes:
  trends_cache:
